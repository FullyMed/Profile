<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>404 - Page Not Found | Maximilliano Felix</title>
    <meta name="robots" content="noindex" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { primary: "#3b82f6", secondary: "#10b981" },
            fontFamily: { sans: ["Inter", "sans-serif"] },
          },
        },
      };
    </script>

    <style>
      html, body { overflow-x: hidden; }
      body { -webkit-font-smoothing: antialiased; }
      :where([class^="ri-"])::before { content: "\f3c2"; }

      .hero-bg {
        background-color: #0c1220;
        background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.055) 1px, transparent 0);
        background-size: 26px 26px;
      }
      .status-code {
        font-size: clamp(5rem, 18vw, 9rem);
        line-height: 1;
        letter-spacing: -0.03em;
        background: linear-gradient(135deg, #3b82f6, #10b981);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .reveal {
        opacity: 0;
        transform: translateY(22px);
        animation: reveal-in 0.7s cubic-bezier(0.16,1,0.3,1) forwards;
      }
      .reveal-d1 { animation-delay: 0.1s; }
      .reveal-d2 { animation-delay: 0.2s; }
      .reveal-d3 { animation-delay: 0.3s; }
      @keyframes reveal-in { to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .reveal { opacity: 1; transform: none; animation: none; }
      }
    </style>
  </head>

  <body class="font-sans hero-bg min-h-screen flex items-center justify-center text-white px-4">
    <!-- blurred orbs, matching the hero section on the main site -->
    <div class="absolute top-1/4 right-1/4 w-[520px] h-[520px] rounded-full pointer-events-none" style="background:radial-gradient(circle, rgba(59,130,246,0.18) 0%, transparent 70%);"></div>
    <div class="absolute bottom-1/3 left-1/4 w-[360px] h-[360px] rounded-full pointer-events-none" style="background:radial-gradient(circle, rgba(16,185,129,0.14) 0%, transparent 70%);"></div>

    <main class="relative z-10 max-w-lg w-full text-center py-16">
      <p class="status-code font-black reveal">404</p>

      <h1 class="text-2xl md:text-3xl font-bold mt-4 mb-3 reveal reveal-d1">Page Not Found</h1>
      <p class="text-slate-400 mb-10 leading-relaxed reveal reveal-d1">
        The page you're looking for doesn't exist or may have moved.
      </p>

      <div class="flex flex-wrap items-center justify-center gap-3 mb-12 reveal reveal-d2">
        <a href="/" class="px-5 py-2.5 bg-primary text-white text-sm font-semibold rounded-lg shadow-lg hover:bg-blue-600 hover:-translate-y-0.5 transition-all duration-200" style="box-shadow: 0 6px 20px rgba(59,130,246,0.35);">
          <i class="ri-home-5-line mr-1.5"></i>Back to Home
        </a>
        <a href="/#contact" class="px-5 py-2.5 text-white text-sm font-semibold rounded-lg border border-white/20 hover:bg-white/10 hover:-translate-y-0.5 transition-all duration-200" style="background:rgba(255,255,255,0.07);">
          <i class="ri-mail-line mr-1.5"></i>Contact Me
        </a>
      </div>

      <div class="flex flex-wrap items-center justify-center gap-x-4 gap-y-2 text-xs text-slate-500 reveal reveal-d3">
        <span class="uppercase tracking-wider">Home in your language:</span>
        <a href="/" class="hover:text-primary transition-colors">English</a>
        <a href="/index-zh.html" class="hover:text-primary transition-colors">中文</a>
        <a href="/index-id.html" class="hover:text-primary transition-colors">Indonesia</a>
        <a href="/index-ja.html" class="hover:text-primary transition-colors">日本語</a>
        <a href="/index-ko.html" class="hover:text-primary transition-colors">한국어</a>
      </div>
    </main>
  </body>
</html>
