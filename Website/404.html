<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>404 - Page Not Found | Maximilliano Felix</title>
    <meta name="robots" content="noindex" />

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#3b82f6" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: { primary: "#3b82f6", secondary: "#10b981" },
            fontFamily: { sans: ["Geist", "system-ui", "sans-serif"] },
          },
        },
      };
    </script>

    <script>
      /* Apply the saved theme before first paint so dark mode carries over from the main site */
      try { if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark"); } catch (e) {}
    </script>

    <style>
      :root { --bg: #f6f6f7; --ink: #18181b; --muted: #52525b; --accent: #2563eb; --btn: #18181b; --btn-ink: #ffffff; --btn-hover: #2c2c31; }
      .dark { --bg: #111113; --ink: #f4f4f5; --muted: #a1a1aa; --accent: #60a5fa; --btn: #f4f4f5; --btn-ink: #18181b; --btn-hover: #ffffff; }
      html, body { overflow-x: clip; }
      body {
        font-family: "Geist", system-ui, sans-serif;
        background: var(--bg); color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      :where([class^="ri-"])::before { content: "\f3c2"; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      .code { font-weight: 600; line-height: 1; letter-spacing: -0.05em; font-size: clamp(6rem, 20vw, 11rem); color: var(--muted); }
      .btn {
        display: inline-flex; align-items: center; gap: 0.5rem; min-height: 44px; padding: 0 18px; border-radius: 999px;
        background: var(--btn); color: var(--btn-ink); font-weight: 600;
        transition: background-color 200ms ease, transform 160ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      .btn:active { transform: scale(0.97); }
      @media (hover: hover) and (pointer: fine) { .btn:hover { background: var(--btn-hover); } }
      .link { text-decoration: underline; text-underline-offset: 0.22em; transition: color 0.2s; }
      .link:hover { color: var(--accent); }
      .muted { color: var(--muted); }
      .rise { opacity: 0; transform: translateY(22px); animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .rise-2 { animation-delay: 0.1s; }
      .rise-3 { animation-delay: 0.2s; }
      @keyframes rise { to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .rise { opacity: 1; transform: none; animation: none; } }
    </style>
  </head>

  <body class="min-h-screen flex flex-col justify-between px-4 md:px-8 py-6">
    <p class="font-bold"><a href="/" class="link" style="text-decoration: none;">Maximilliano Felix</a></p>

    <main class="py-10">
      <h1>
        <span class="code block rise">404</span>
        <span class="block text-3xl md:text-4xl font-bold tracking-tight mt-4 rise rise-2">Page not found</span>
      </h1>
      <p class="mt-3 text-lg max-w-xl rise rise-2">The page you're looking for doesn't exist or may have moved.</p>
      <div class="mt-8 flex flex-wrap items-center gap-x-6 gap-y-3 rise rise-3">
        <a href="/" class="btn"><i class="ri-home-5-line" aria-hidden="true"></i>Back to home</a>
        <a href="/#contact" class="link">Contact me</a>
      </div>
    </main>

    <nav class="flex flex-wrap gap-x-5 gap-y-2 muted" aria-label="Home in your language">
      <span>Home in your language:</span>
      <a href="/" class="link" lang="en">English</a>
      <a href="/index-zh.html" class="link" lang="zh-Hant">中文</a>
      <a href="/index-id.html" class="link" lang="id">Indonesia</a>
      <a href="/index-ja.html" class="link" lang="ja">日本語</a>
      <a href="/index-ko.html" class="link" lang="ko">한국어</a>
    </nav>
  </body>
</html>
