[build]
  publish = "."
  command = ""

# ─────────────────────────────────────────────────────────────
# Security response headers (applied to every path on the site)
# ─────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Lock down where the page may load resources from. Hosts listed
    # match exactly what the site uses today: Google Fonts, the Remix
    # Icon CSS + font on cdnjs, the Tailwind Play CDN, and the CARTO
    # basemap tiles for the contact-section map. Everything else is
    # same-origin. 'unsafe-inline' / 'unsafe-eval' are required by the
    # Tailwind Play CDN and the inline <script>/<style> blocks; they
    # can be dropped later if Tailwind is precompiled to a static file.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https://*.basemaps.cartocdn.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; connect-src 'self'; upgrade-insecure-requests"

    # Clickjacking protection for older browsers that ignore CSP frame-ancestors
    X-Frame-Options = "DENY"

    # Stop the browser from MIME-sniffing a response away from its declared type
    X-Content-Type-Options = "nosniff"

    # Don't leak full URLs / query strings to third-party sites
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Force HTTPS on repeat visits for a year (Netlify already serves HTTPS)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # Turn off browser features this site never uses
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"

# Long-cache the self-hosted vendor assets (immutable, versioned by path)
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
